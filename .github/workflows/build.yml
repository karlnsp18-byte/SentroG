name: Build SentroG

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "APP-20261029T050749Z-1-001.zip"
      - ".github/workflows/build.yml"
      - "scripts/**"

permissions:
  contents: write

jobs:
  raspberry-pi-5-arm64:
    name: Build Raspberry Pi 5 kiosk (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk python3-dev unzip zip libgl1 libglib2.0-0
      - name: Extract app sources
        run: |
          mkdir -p incoming buildsrc
          unzip -q APP-20261029T050749Z-1-001.zip -d incoming
          test -f incoming/APP/sentro_ginhawa_refined.py
          test -f incoming/APP/files/kiosk_bridge/firebase_bridge.py
          cp incoming/APP/sentro_ginhawa_refined.py buildsrc/sentro_ginhawa.py
          cp incoming/APP/files/kiosk_bridge/firebase_bridge.py buildsrc/firebase_bridge.py
          python3 -m py_compile buildsrc/sentro_ginhawa.py buildsrc/firebase_bridge.py
      - name: Install Python build dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install pyinstaller pillow pyserial python-dotenv reportlab numpy opencv-python-headless firebase-admin
      - name: Package native ARM64 kiosk
        run: |
          .venv/bin/pyinstaller --noconfirm --clean --onedir --windowed \
            --name SentroGinhawa --paths buildsrc \
            --hidden-import serial.tools.list_ports --hidden-import firebase_bridge \
            --collect-all cv2 --collect-all firebase_admin --collect-all google.cloud.firestore \
            --distpath dist --workpath build/pyinstaller --specpath build \
            buildsrc/sentro_ginhawa.py
          test -x dist/SentroGinhawa/SentroGinhawa
          cat > dist/SentroGinhawa/README-INSTALL.txt <<'EOF'
          Sentro Ginhawa kiosk build for Raspberry Pi OS 64-bit (ARM64).
          No credentials or resident database are included. Keep device credentials
          outside this bundle. Test all peripherals and Firebase sync on a real Pi 5.
          EOF
          cd dist && zip -qr SentroGinhawa-RaspberryPi5-ARM64.zip SentroGinhawa
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentroGinhawa-RaspberryPi5-ARM64
          path: dist/SentroGinhawa-RaspberryPi5-ARM64.zip
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub Release for tagged versions
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/SentroGinhawa-RaspberryPi5-ARM64.zip

  mobile-build-readiness:
    name: Check Flutter mobile build inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Report Flutter build blockers
        run: |
          unzip -l APP-20261029T050749Z-1-001.zip > /tmp/archive-list.txt
          grep -qE 'APP/files/pubspec.yaml|APP/files/sentro_ginhawa_app_update/pubspec.yaml' /tmp/archive-list.txt || echo "::warning::Flutter project pubspec.yaml is missing; APK build cannot run yet."
          grep -qE 'firebase_options.dart' /tmp/archive-list.txt || echo "::warning::Flutter firebase_options.dart is missing; configure Firebase before APK build."
          echo "This job checks prerequisites only; it does not claim to build an APK."
